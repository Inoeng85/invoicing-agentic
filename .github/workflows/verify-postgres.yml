name: Verify PostgreSQL

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/database/**'
      - '.github/workflows/verify-postgres.yml'

permissions:
  contents: read

jobs:
  verify-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invoicing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/invoicing_test
      SESSION_SECRET: ci-session-secret-not-for-production
      EMAIL_PROVIDER: log
      NODE_ENV: test
      APP_URL: "http://localhost:44100"
      CORS_ORIGIN: "http://localhost:44100"
      API_BASE_URL: "http://localhost:44101"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: |
          cp packages/database/.env.example packages/database/.env
          cp apps/web/.env.example apps/web/.env
          cp apps/api/.env.example apps/api/.env
      - run: npm run db:migrate:deploy:postgres
      - run: npm run verify
