name: Deploy production

# PG-3: tag SemVer → Environment `production` (approval) — docs/operations/deployment/railway/README.md

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run css:build
      - name: Host env check
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "host:check skipped (secrets not set)."
            exit 0
          fi
          npm run host:check
      - name: Prisma migrate (SQLite)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Migrate skipped (DATABASE_URL not set in production environment)."
            exit 0
          fi
          npm run db:migrate:deploy
      - name: Deploy API (Railway)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID_API: ${{ secrets.RAILWAY_SERVICE_ID_API }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_SERVICE_ID_API" ]; then
            echo "Railway API deploy skipped (secrets not set)."
            exit 0
          fi
          npm install -g @railway/cli@4
          railway redeploy --service "$RAILWAY_SERVICE_ID_API" -y
      - name: Deploy web (Railway)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID_WEB: ${{ secrets.RAILWAY_SERVICE_ID_WEB }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_SERVICE_ID_WEB" ]; then
            echo "Railway web deploy skipped (secrets not set)."
            exit 0
          fi
          npm install -g @railway/cli@4
          railway redeploy --service "$RAILWAY_SERVICE_ID_WEB" -y
      - name: Smoke health
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "Smoke skipped (API_BASE_URL not set)."
            exit 0
          fi
          npm run staging:smoke
      - name: Release tag
        run: echo "Deployed ${GITHUB_REF_NAME} to production (when host secrets configured)."
