name: CI

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check documentation
        run: |
          npm run docs:test
          npm run design:css
          npm run docs:check

      - name: Prepare environment files
        run: |
          cp packages/database/.env.example packages/database/.env
          cp apps/web/.env.example apps/web/.env
          cp apps/api/.env.example apps/api/.env

      - name: Apply database migrations
        run: npm run db:migrate:deploy
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Verify (typecheck, tests, CSS, gate)
        run: npm run verify
        env:
          DATABASE_URL: "file:./dev.db"
          SESSION_SECRET: ci-session-secret-not-for-production
          EMAIL_PROVIDER: log
          NODE_ENV: test
          APP_URL: "http://localhost:44100"
          CORS_ORIGIN: "http://localhost:44100"
          API_BASE_URL: "http://localhost:44101"
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}

      - name: Upload gate summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-summary
          path: |
            docs/reports/gates/gate-results.json
            docs/reports/gates/gate-summary.md
            docs/reports/gate-summary.md
          if-no-files-found: ignore
